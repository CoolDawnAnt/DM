[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "displacement-matching"
version = "0.1.0"
description = "Displacement Matching for few-step text-to-image diffusion models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "diffusers>=0.33,<0.40",
  "transformers>=4.40,<5",
  "peft>=0.10,<1",
  "accelerate>=1.0,<2",
  "huggingface-hub>=0.29,<1",
  "hpsv2>=1.2,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
logging = ["wandb>=0.18,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
dm-train = "dm.train:main"

[tool.setuptools.packages.find]
include = ["dm*"]
